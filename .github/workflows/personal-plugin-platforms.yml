name: Personal plugin platforms
on:
  push:
    branches: [main]
    paths:
      - 'plugin/**'
      - 'crates/**'
      - 'assets/**'
      - 'script/build-deb.py'
      - 'script/zed-nick-launch'
      - 'script/tests/test_deb_launch.py'
      - 'Cargo.*'
      - '.rules'
      - '.github/workflows/personal-plugin-platforms.yml'
  pull_request:
    paths:
      - 'plugin/**'
      - 'crates/**'
      - 'assets/**'
      - 'script/build-deb.py'
      - 'script/zed-nick-launch'
      - 'script/tests/test_deb_launch.py'
      - 'Cargo.*'
      - '.rules'
      - '.github/workflows/personal-plugin-platforms.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check native packaging and configuration contracts
        run: python plugin/zed-runner/tests/metadata_smoke.py
      - name: Exercise native runtimes without PowerShell
        run: python plugin/zed-runner/tests/native_smoke.py
      - name: Check bundled Debian plugin installation
        if: runner.os == 'Linux'
        run: python script/tests/test_deb_launch.py
      - name: Check UTF-8 output through a real Windows pseudo console
        if: runner.os == 'Windows'
        run: python plugin/zed-runner/tests/windows_console_smoke.py
      - name: Install pinned community extensions without PowerShell
        run: python plugin/install.py --community-only --extensions-directory .local-community-test/extensions
      - name: Check MyBatis native server and portable extension
        run: |
          cargo test --locked --manifest-path plugin/zed-mybatis-jump/Cargo.toml -p mybatis-jump-lsp

          rustup target add wasm32-wasip2

          cargo check --locked --manifest-path plugin/zed-mybatis-jump/Cargo.toml -p zed-mybatis-jump --target wasm32-wasip2
      - name: Check Java syntax highlighting
        run: cargo test --locked --manifest-path plugin/zed-java-fork/tests/highlights/Cargo.toml
      - name: Check Java native components and portable extension
        run: |
          cargo test --locked --manifest-path plugin/zed-java-fork/Cargo.toml -p proxy-common -p java-lsp-proxy -p gradle-lsp-bridge

          cargo check --locked --manifest-path plugin/zed-java-fork/Cargo.toml -p zed_java --target wasm32-wasip2
  app:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: script/linux
      - name: macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install cmake ninja
      - uses: Swatinem/rust-cache@v2
        with:
          key: personal-app-${{ runner.os }}
      - name: Compile personal app features on this platform
        run: cargo check --locked -p zed -p maven_panel
      - name: Check display-size SVG icon rasterization
        run: cargo test --locked -p ui --lib external_icon_tests
      - name: Check delayed tab switching
        run: cargo test --locked -p tab_switcher --lib test_open_item_on_modifiers_release
      - name: Check double-click file opening
        run: cargo test --locked -p project_panel --lib test_double_click_open_mode
      - name: Check Git remote branch selection
        run: cargo test --locked -p git_ui --lib test_remote_branch_names
      - name: Check cancelling Git remote picker
        run: cargo test --locked -p git_ui --lib test_cancelling_picker_prompt_resolves_to_none
      - name: Check localized schema cache invalidation
        run: cargo test --locked -p json_schema_store --lib test_language_change_invalidates_localized_schemas
      - name: Check shared internationalization core
        run: cargo test --locked -p i18n
      - name: Check native entry discovery and task contracts
        run: cargo test --locked -p title_bar --lib native_tests
